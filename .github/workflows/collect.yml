name: Statistiken sammeln

on:
  schedule:
    # Alle drei Stunden. Spielwerte stehen ohnehin erst nach Spielende fest,
    # oefter waere nur Last ohne Nutzen. Cron laeuft in UTC.
    - cron: '20 */3 * * *'
  workflow_dispatch: {}

# Der Arbeitsstand (collector/state.json) wird zurueckgeschrieben, damit der
# naechste Lauf nicht die ganze Saison neu holt.
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten
        run: pip install -r collector/requirements.txt

      - name: Sammeln und an die App schicken
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python collector/collect.py

      - name: Arbeitsstand sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collector/state.json
          git diff --staged --quiet || git commit -m "Arbeitsstand des Sammlers"
          git push
