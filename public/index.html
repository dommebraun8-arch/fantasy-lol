<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Fantasy-Liga fuer LoL-Esports: Kader aus echten Profispielern, Punkte aus echten Spielwerten.">
<title>Fantasy LoL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Am Telefon steht die Marke oben und die Navigation unten am Daumen; ab
     760px wandert beides in die Leiste links, wie auf lolkleena. -->
<div class="topbar">
  <div class="brand">Fantasy<span>LoL</span></div>
  <div class="who" id="who"></div>
</div>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="mark" aria-hidden="true">FL</div>
    <nav class="tabs" id="tabs" hidden></nav>
    <div class="me" id="me" aria-hidden="true"></div>
  </aside>

  <main class="wrap" id="app">
    <p class="loading">Lade…</p>
  </main>
</div>

<!-- Welche Fassung gerade läuft. Klingt nach Kleinkram, beantwortet aber die
     Frage "ist mein Deploy angekommen?" ohne Suchen im Bildschirmfoto. -->
<p class="build" id="build"></p>

<div class="sheet-back" id="sheet-back"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Spieler wählen">
  <div class="grip"></div>
  <header>
    <div class="row">
      <h2 id="sheet-title">Spieler wählen</h2>
      <div class="spacer"></div>
      <button class="btn ghost small" id="sheet-close">Schließen</button>
    </div>
    <p class="sub" id="sheet-sub"></p>
    <input class="search" id="sheet-search" type="search" placeholder="Name oder Team" autocomplete="off">
    <div class="filters" id="sheet-filters"></div>
  </header>
  <div class="body" id="sheet-list"></div>
</div>

<noscript><p class="wrap">Diese App braucht JavaScript.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
