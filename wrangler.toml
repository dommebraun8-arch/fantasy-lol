name = "fantasy-lol"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Das Frontend liegt als statische Dateien beim Worker - ein Deploy, eine URL.
# Bewusst ohne not_found_handling: der Worker entscheidet selbst, was mit
# unbekannten Pfaden passiert (siehe src/index.js). Sonst hinge es von der
# Reihenfolge des Asset-Routers ab, ob /api/* noch beim Code ankommt.
[assets]
directory = "./public"
binding = "ASSETS"

# Angelegt mit "npx wrangler d1 create fantasy-lol".
#
# binding = "DB" muss so bleiben: der Code greift ueber env.DB zu. Wrangler
# schlaegt beim Anlegen den Datenbanknamen als Binding vor ("fantasy_lol") -
# uebernimmt man das, ist env.DB undefined und jede Anfrage endet im Fehler.
#
# Die database_id ist kein Geheimnis, sondern nur eine Kennung; ohne Zugang
# zum Cloudflare-Konto laesst sich damit nichts anfangen. Deshalb steht sie
# hier im Repo, wie in Cloudflares eigenen Vorlagen auch.
[[d1_databases]]
binding = "DB"
database_name = "fantasy-lol"
database_id = "843a1948-31d3-4972-90de-ddee07d0ca9b"

[vars]
# Wie lange eine Anmeldung gilt (Tage).
SESSION_DAYS = "30"

# Geheimnisse (nicht hier eintragen, sondern:
#   npx wrangler secret put INGEST_TOKEN
# ) - der Sammler weist sich damit bei /api/ingest aus.
